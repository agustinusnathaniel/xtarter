packages:
  - packages/*
  - apps/*

allowBuilds:
  esbuild: true
  msgpackr-extract: false
  sharp: true

catalog:
  # TS 7 (native compiler) is latest, but astro check / @astrojs/check still
  # require the TS 6 programmatic API - pinned to newest 6.x until astro supports 7.
  typescript: ^6.0.3
  "@types/node": ^26.6.5
  json5: ^2.2.3
  pathe: ^2.0.3
  tinyexec: ^1.3.1
  nypm: ^0.6.10
  jsonc-parser: ^3.3.1
  magicast: ^0.5.5
  consola: ^3.4.2
  defu: ^6.1.7
  vite-plus: 1.1.0
  "@clack/prompts": ^1.8.1
  citty: ^0.2.2
  giget: ^3.3.1
  effect: 4.0.4
  picocolors: ^1.1.1
  diff: ^9.0.0
  pkg-types: ^2.3.3
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0

# Only resolve versions published at least a day ago (pnpm's default, made
# explicit so a global override cannot loosen it for this repository).
minimumReleaseAge: 1440

onlyBuiltDependencies:
  - esbuild
  - sharp
overrides:
  # astro@7.2.4 pins vite to npm:@voidzero-dev/vite-plus-core@0.2.5, which
  # diverges from the catalog (1.1.0) and installs a second instance whose
  # native rolldown binding is missing. Force a single 1.1.0 instance.
  "@voidzero-dev/vite-plus-core": 1.1.0
  dompurify: 3.4.17
  postcss: 8.5.30
  ws: 8.22.0
  read-yaml-file>js-yaml: 3.15.1
  yaml: 2.9.1
  fast-uri: 3.1.5
  tmp: 0.2.7
  nanoid: 3.3.18
  vite@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
