packages:
  - packages/*
  - apps/*

allowBuilds:
  esbuild: true
  msgpackr-extract: false
  sharp: true

catalog:
  # TS 7 (native compiler) is latest, but astro check / @astrojs/check still
  # require the TS 6 programmatic API — pinned to newest 6.x until astro supports 7.
  typescript: ^6.0.3
  "@types/node": ^26.2.0
  json5: ^2.2.3
  pathe: ^2.0.3
  tinyexec: ^1.3.0
  nypm: ^0.6.9
  jsonc-parser: ^3.3.1
  magicast: ^0.5.4
  consola: ^3.4.2
  defu: ^6.1.7
  vite-plus: 0.2.9
  "@biomejs/biome": "2.5.9"
  "@clack/prompts": ^1.7.0
  citty: ^0.2.2
  giget: ^3.3.1
  tinyglobby: ^0.2.17
  effect: 4.0.0-beta.91
  picocolors: ^1.1.1
  diff: ^9.0.0
  pkg-types: ^2.3.1
  vite: npm:@voidzero-dev/vite-plus-core@0.2.9

minimumReleaseAgeExclude:
  - "@astrojs/markdown-satteri@0.3.2"
  - "@astrojs/starlight@0.41.0"
  - astro@7.0.2

onlyBuiltDependencies:
  - esbuild
  - sharp
overrides:
  vite: 'catalog:'
  # astro@7.2.4 pins vite to npm:@voidzero-dev/vite-plus-core@0.2.5, which
  # diverges from the catalog (0.2.9) and installs a second instance whose
  # native rolldown binding is missing. Force a single 0.2.9 instance.
  '@voidzero-dev/vite-plus-core': 0.2.9
  dompurify: 3.4.13
  postcss: 8.5.25
  ws: 8.21.0
  read-yaml-file>js-yaml: 3.15.1
  yaml: 2.8.3
  fast-uri: 3.1.5
  tmp: 0.2.7
  nanoid: 3.3.18
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
