name: 'Xstarter Setup'
description: 'Install dependencies with pnpm and restore Turborepo cache'
runs:
  using: 'composite'
  steps:
    - uses: pnpm/setup@v1
      with:
        cache: true
    - name: Get pnpm store directory
      id: pnpm-store
      shell: bash
      run: |
        echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
    - name: Restore pnpm store
      uses: actions/cache@v6
      with:
        path: ${{ steps.pnpm-store.outputs.store }}
        key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-${{ runner.os }}-
    - name: Restore Turborepo cache
      uses: actions/cache@v6
      with:
        path: .turbo/cache
        key: turbo-${{ runner.os }}-${{ hashFiles('turbo.json', 'pnpm-lock.yaml') }}
        restore-keys: |
          turbo-${{ runner.os }}-
