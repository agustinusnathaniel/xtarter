name: Nightly

on:
  schedule:
    # Daily full-fidelity run: real installs, every suite, catches coupling
    # the sharded PR legs cannot see.
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  full-test:
    name: Full test suite (real installs)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup

      - name: Build
        run: pnpm build:ci

      # No XTARTERIZE_SKIP_REAL_INSTALL and no sharding: full coupling check.
      - name: Full test suite
        run: pnpm exec vp test
