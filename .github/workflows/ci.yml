name: CI

# Every change runs both jobs; the Turborepo cache skips work whose inputs did
# not change. Both jobs always report a status, so they can be required checks.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-and-test:
    name: Check and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # test/docs needs the docs dependencies, so it runs in the Docs job.
      - uses: ./.github/actions/setup
        with:
          install-filter: '!@xtarter/docs'

      - name: Check and test
        run: pnpm check:ci

      # Restored entries accumulate across runs; drop ones untouched for a week.
      - name: Prune Turborepo cache
        run: find .turbo/cache -type f -mtime +7 -delete 2>/dev/null || true

  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup

      - name: Check and build docs
        run: pnpm turbo run typecheck build --filter=@xtarter/docs

      - name: Test docs
        env:
          XTARTERIZE_TEST_DOCS_ARTIFACTS: '1'
        run: pnpm exec vp test test/docs

      - name: Prune Turborepo cache
        run: find .turbo/cache -type f -mtime +7 -delete 2>/dev/null || true
