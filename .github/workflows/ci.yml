name: CI

# No path filters: both jobs always run, so they can be required checks, and
# the Turborepo cache skips unchanged work.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-and-test:
    name: Check and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Depth 2 keeps the merge commit's first parent, the base the pull request merges into.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # test/docs needs the docs dependencies, so it runs in the Docs job.
      - uses: ./.github/actions/setup
        with:
          install-filter: "!@xtarter/docs"

      # A pull request runs only the test files its diff can reach (scripts/test-changed.mts);
      # main runs them all.
      - name: Check and test
        env:
          TEST_CHANGED_SINCE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}
        run: |
          if [ -n "$TEST_CHANGED_SINCE" ]; then
            pnpm check:ci:pr
          else
            pnpm check:ci
          fi

      # Restored entries accumulate across runs; drop ones untouched for a week.
      - name: Prune Turborepo cache
        run: find .turbo/cache -type f -mtime +7 -delete

  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Check and build docs
        run: pnpm turbo run typecheck build --filter=@xtarter/docs

      - name: Test docs
        env:
          XTARTERIZE_TEST_DOCS_ARTIFACTS: "1"
        run: pnpm exec vp test test/docs

      - name: Prune Turborepo cache
        run: find .turbo/cache -type f -mtime +7 -delete
