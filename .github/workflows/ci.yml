name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "apps/docs/**"
      - "docs/**"
      - '.changeset/**'
      - '.maestria/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - "apps/docs/**"
      - "docs/**"
      - '.changeset/**'
      - '.maestria/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-and-test:
    name: Check and Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Shallow clone: check:ci runs every task without git comparison,
          # so full history is unnecessary. Release keeps fetch-depth 0
          # because changesets and tags need history.
          fetch-depth: 1

      - uses: ./.github/actions/setup

      - name: Check (lint + typecheck + build + test + verify:shebangs)
        run: pnpm check:ci
