name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "apps/docs/**"
      - "docs/**"
      - '.changeset/**'
      - '.maestria/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - "apps/docs/**"
      - "docs/**"
      - '.changeset/**'
      - '.maestria/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-and-test:
    name: Check and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup

      - name: Check and test
        run: pnpm check:ci
