name: Release

on:
  push:
    branches:
      - main
    paths:
      - ".changeset/**"
      - "**/CHANGELOG.md"
      - "**/package.json"
      - ".github/workflows/release.yml"
      - "pnpm-lock.yaml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VITE_GIT_HOOKS: "0"
    steps:
      # A GITHUB_TOKEN-authored Version Packages PR leaves its CI waiting for
      # approval. An app token makes CI run on it like any other PR; without the
      # app configured, fall back to GITHUB_TOKEN.
      - name: Create release app token
        id: app-token
        if: vars.RELEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          install-filter: '!@xtarter/docs'

      # Manual runs off main only verify that the packages build.
      - name: Build
        if: github.ref != 'refs/heads/main'
        run: pnpm build:ci

      # Versioning only needs the Changesets CLI; build inside the publish
      # script so only publishing runs pay for it.
      - name: Create Release Pull Request or Publish
        if: github.ref == 'refs/heads/main'
        uses: changesets/action@v2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release:ci
          pr-title: "chore: version packages"
          commit-message: "chore: version packages"
          github-token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
